name: Final Absolute Fix

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip and Move
      run: |
        unzip *.zip
        mv OpenHC-*/* .
        rm -rf OpenHC-*

    - name: Inject BouncyCastle via Python
      run: |
        python3 -c "
        import os, re
        for root, dirs, files in os.walk('.'):
            for f in files:
                if f == 'AuthCrypto.kt':
                    p = os.path.join(root, f)
                    with open(p, 'r', encoding='utf-8') as file:
                        content = file.read()
                    new_code = '''internal object AesGcm {
            const val TAG_LENGTH = 16
            fun encrypt(key: ByteArray, nonce: ByteArray, aad: ByteArray, plain: ByteArray): ByteArray {
                val cipher: GCMModeCipher = GCMBlockCipher.newInstance(AESEngine.newInstance())
                val params = AEADParameters(KeyParameter(key), TAG_LENGTH * 8, nonce, if (aad.isEmpty()) null else aad)
                cipher.init(true, params)
                val out = ByteArray(cipher.getOutputSize(plain.size))
                var len = cipher.processBytes(plain, 0, plain.size, out, 0)
                len += cipher.doFinal(out, len)
                return out.copyOf(len)
            }
            fun decrypt(key: ByteArray, nonce: ByteArray, aad: ByteArray, cipherAndTag: ByteArray): ByteArray? {
                if (key.size != 16 && key.size != 24 && key.size != 32) return null
                if (nonce.isEmpty() || cipherAndTag.size < TAG_LENGTH) return null
                return try {
                    val cipher: GCMModeCipher = GCMBlockCipher.newInstance(AESEngine.newInstance())
                    val params = AEADParameters(KeyParameter(key), TAG_LENGTH * 8, nonce, if (aad.isEmpty()) null else aad)
                    cipher.init(false, params)
                    val out = ByteArray(cipher.getOutputSize(cipherAndTag.size))
                    var len = cipher.processBytes(cipherAndTag, 0, cipherAndTag.size, out, 0)
                    len += cipher.doFinal(out, len)
                    out.copyOf(len)
                } catch (e: Exception) { null }
            }
        }'''
                    content = re.sub(r'internal object AesGcm \{.*?\n\}', new_code, content, flags=re.DOTALL)
                    if 'import org.bouncycastle.crypto.engines.AESEngine' not in content:
                        content = content.replace('import javax.crypto.spec.SecretKeySpec', 'import javax.crypto.spec.SecretKeySpec\nimport org.bouncycastle.crypto.engines.AESEngine\nimport org.bouncycastle.crypto.modes.GCMBlockCipher\nimport org.bouncycastle.crypto.modes.GCMModeCipher\nimport org.bouncycastle.crypto.params.AEADParameters\nimport org.bouncycastle.crypto.params.KeyParameter\nimport org.bouncycastle.crypto.InvalidCipherTextException')
                    with open(p, 'w', encoding='utf-8') as file:
                        file.write(content)
        "

    - name: Complete Identity
      run: |
        mkdir -p app/src/main/assets
        if [ -f docs/identity.example.json ]; then cp docs/identity.example.json app/src/main/assets/openhc-identity.json; fi
        if [ -f identity.example.json ]; then cp identity.example.json app/src/main/assets/openhc-identity.json; fi

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Final-Fixed-APK
        path: "**/build/outputs/apk/debug/*.apk"
